    <radialGradient id="glow"><stop stop-color="#5baaff" stop-opacity=".16"/><stop offset="1" stop-color="#5baaff" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
